name: Update EVDS Deposit Rates

on:
  schedule:
    # Her Perşembe UTC 10:50 (TSİ 13:50)
    - cron: "50 10 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch EVDS data
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python fetch_evds.py

      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mevduat.csv
          if ! git diff --staged --quiet; then
            git commit -m "Update EVDS deposit rates"
            git push
          fi
